<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CDN 行為檢測台</title>
  <style>
    :root{
      --bg:#10131c; --panel:#171b28; --panel2:#1e2435; --line:#2b3246;
      --text:#eef1f7; --muted:#9298aa; --mono:ui-monospace,"SF Mono",Menlo,monospace;
      --hit:#4fd38a; --miss:#f0a24b; --unknown:#7f8aa3; --accent:#7aa7e6;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;
      background:var(--bg);color:var(--text);min-height:100vh;padding:28px 20px;line-height:1.6;
      display:flex;justify-content:center;}
    .wrap{width:100%;max-width:620px}
    .head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:4px}
    h1{font-size:21px;font-weight:600}
    .page-tag{font-family:var(--mono);font-size:12px;color:var(--accent);
      border:1px solid var(--line);border-radius:999px;padding:3px 10px}
    .sub{color:var(--muted);font-size:14px;margin-bottom:22px}

    .verdict{border-radius:14px;padding:20px;margin-bottom:20px;border:1px solid var(--line);
      background:var(--panel);display:flex;align-items:center;gap:16px}
    .dot{width:14px;height:14px;border-radius:50%;flex:0 0 auto;background:var(--unknown)}
    .verdict.hit .dot{background:var(--hit)} .verdict.miss .dot{background:var(--miss)}
    .verdict .big{font-size:18px;font-weight:600}
    .verdict .desc{font-size:13px;color:var(--muted);margin-top:2px}

    .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;
      padding:6px 20px;margin-bottom:20px}
    .r{display:flex;justify-content:space-between;align-items:center;gap:16px;
      padding:13px 0;border-bottom:1px solid var(--line);font-size:14px}
    .r:last-child{border-bottom:none}
    .r .k{color:var(--muted);flex:0 0 auto}
    .r .v{font-family:var(--mono);text-align:right;word-break:break-all}
    .v.na{color:var(--unknown)}
    .section-title{font-size:12px;color:var(--muted);margin:0 0 8px 4px;letter-spacing:.02em}

    .nav{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
    .btn{font-size:14px;text-decoration:none;padding:11px 18px;border-radius:10px;
      border:1px solid var(--line);color:var(--text);background:var(--panel2);cursor:pointer}
    .btn:hover{border-color:var(--accent)}
    .btn.primary{background:rgba(122,167,230,.16);border-color:rgba(122,167,230,.45);color:var(--accent)}

    .note{font-size:13px;color:var(--muted);background:var(--panel);border:1px solid var(--line);
      border-radius:14px;padding:16px 18px}
    .note b{color:var(--text);font-weight:600}
    .note code{font-family:var(--mono);background:var(--panel2);padding:1px 6px;border-radius:5px;font-size:12px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <h1>CDN 行為檢測台</h1>
      <span class="page-tag">index</span>
    </div>
    <p class="sub">這頁會即時讀取自己收到的回應標頭,幫你對照 CDN 的實際行為,不用開開發者工具。</p>

    <div class="verdict" id="verdict">
      <span class="dot"></span>
      <div>
        <div class="big" id="verdict-title">檢測中…</div>
        <div class="desc" id="verdict-desc">正在重新請求自己並讀取標頭</div>
      </div>
    </div>

    <div class="section-title">快取相關標頭(由 CDN 回應)</div>
    <div class="panel" id="cache-panel"></div>

    <div class="section-title">這次請求 / 頁面資訊</div>
    <div class="panel" id="page-panel"></div>

    <div class="nav">
      <button class="btn primary" onclick="recheck()">重新檢測一次</button>
      <a class="btn" href="about.html">前往 about 頁 &rarr;</a>
    </div>

    <div class="note">
      <b>怎麼用:</b> 連按兩次「重新檢測」。第一次可能是 <code>MISS</code>(CDN 回源抓最新),
      第二次通常變 <code>HIT</code>(直接由快取回)。<br>
      <b>注意:</b> <code>MISS</code> 代表拿到的是源站最新版,<code>HIT</code> 代表拿到的是快取裡的版本。<br>
      若標頭顯示「無法取得」,多半是 CDN 未回傳該欄位,或瀏覽器基於跨來源限制讀不到——這本身也是一條線索。
    </div>
  </div>

  <script>
    var CACHE_HEADERS = ['x-cache','age','cache-control','x-cache-remote','via','cf-cache-status','x-served-by','etag','last-modified','expires'];

    function row(k, v, isNa){
      return '<div class="r"><span class="k">'+k+'</span><span class="v'+(isNa?' na':'')+'">'+v+'</span></div>';
    }

    function setVerdict(state, title, desc){
      var el = document.getElementById('verdict');
      el.className = 'verdict' + (state ? ' '+state : '');
      document.getElementById('verdict-title').textContent = title;
      document.getElementById('verdict-desc').textContent = desc;
    }

    function fillPage(){
      var html = '';
      html += row('你造訪的網址', location.host || '(本機檔案)');
      html += row('目前路徑', location.pathname || '/');
      html += row('協議', location.protocol.replace(':',''));
      html += row('本次載入時間', new Date().toLocaleString('zh-TW'));
      document.getElementById('page-panel').innerHTML = html;
    }

    function recheck(){
      setVerdict('', '檢測中…', '正在重新請求自己並讀取標頭');
      document.getElementById('cache-panel').innerHTML = row('狀態', '請求中…', true);

      var url = location.pathname + '?_probe=' + Date.now();
      fetch(url, {cache:'no-store'}).then(function(res){
        var found = {};
        CACHE_HEADERS.forEach(function(h){
          var val = res.headers.get(h);
          if(val !== null) found[h] = val;
        });

        var html = '';
        CACHE_HEADERS.forEach(function(h){
          if(found[h] !== undefined) html += row(h, found[h]);
        });
        if(html === '') html += row('快取標頭', '這次沒讀到任何快取相關標頭', true);
        document.getElementById('cache-panel').innerHTML = html;

        var xc = (found['x-cache'] || found['cf-cache-status'] || found['x-cache-remote'] || '').toLowerCase();
        if(xc.indexOf('hit') > -1){
          setVerdict('hit', '命中(HIT)', '這次直接由 CDN 快取回傳,沒有回源');
        } else if(xc.indexOf('miss') > -1){
          setVerdict('miss', '未命中(MISS)', '這次 CDN 回源抓了最新版,並存進快取');
        } else {
          var age = found['age'];
          if(age !== undefined && parseInt(age,10) > 0){
            setVerdict('hit', '可能命中', '沒有 X-Cache,但 Age='+age+' 代表這份在快取中已存在一段時間');
          } else {
            setVerdict('', '無法判定', '這次沒讀到 X-Cache 之類的欄位;可能是 CDN 未回傳,或跨來源讀取限制');
          }
        }
      }).catch(function(e){
        document.getElementById('cache-panel').innerHTML = row('錯誤', '請求失敗:'+e.message, true);
        setVerdict('', '無法檢測', '對自己的請求失敗,可能是網路或 CORS 限制');
      });
    }

    fillPage();
    recheck();
  </script>
</body>
</html>
